<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>Pixie Hollow | Pixie Hollow | Disney Fairies</title>
<META NAME="ROBOTS" CONTENT="NONE">
<meta name="viewport" content="width=994">
<!-- the client runs under ruffle where it can and adobe flash where it can't -->
<script type="text/javascript" src="swfobject.js"></script>
<script type="text/javascript" src="master_flash_light.js"></script>
<script type="text/javascript" src="fairies_framework.js"></script>
<script type="text/javascript" src="environment.js"></script>
<script type="text/javascript" src="phPlayer.js"></script>
<style type="text/css">
	/* pinch-zoom stays with the browser, one finger still belongs to the game */
	ruffle-player { touch-action: pinch-zoom; }
</style>
<link rel="icon" href="wings.ico" type="image/x-icon" />
<link rel="shortcut icon" href="wings.ico" type="image/x-icon" />
<script type="text/javascript">
	//window.onunload=handleUnload
</script>
<script type="text/javascript">
	var varCssPath = baseSwfPath+"css/main.css";
	document.write('<style type="text/css">@import url('+varCssPath+');</style>');
</script>
</head>
<body bgcolor="#24304A">
	<center class="normalbg">

	<div id="flashcontent">
		<div id="innerflashcontent">
		</div>
	</div>

	<script type="text/javascript">

		var varSwfPath = baseSwfPath+"swf/container.swf"
		var var_html_environment = ""; // What am I?

		var flashvars = {};
		flashvars.session = "xml/sessions/mmo.xml";
		flashvars.currentUrl = getCurrentUrl();
		flashvars.htmlEnvironment = var_html_environment;
		flashvars.base = baseSwfPath;
		var requestedRenderer = new URLSearchParams(window.location.search).get("renderer");
		// browser zoom, ruffle would otherwise swallow ctrl+wheel and ctrl +/-/0
		window.addEventListener("wheel", function (e) {
			if (e.ctrlKey) e.stopImmediatePropagation();
		}, { capture: true, passive: true });
		window.addEventListener("keydown", function (e) {
			if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "_", "0"].indexOf(e.key) >= 0) e.stopImmediatePropagation();
		}, true);
		// ?quality=medium or low draws a lighter picture, for a computer that is struggling. It is kept
		// for next time, ?quality=high puts it back
		var requestedQuality = new URLSearchParams(window.location.search).get("quality");
		try {
			if (requestedQuality) localStorage.setItem("phQuality", requestedQuality);
			else requestedQuality = localStorage.getItem("phQuality");
		} catch (e) {}
		var ruffleQuality = ["low", "medium", "high"].indexOf(requestedQuality) >= 0 ? requestedQuality : undefined;
		var ruffleRenderer = ["webgpu", "wgpu-webgl", "webgl", "canvas"].indexOf(requestedRenderer) >= 0
			? requestedRenderer
			: undefined;

		phPlayer.embed({
			container: "flashcontent",
			id: "pixiehollowcontent",
			swf: varSwfPath,
			width: 994,
			height: 680,
			flashvars: flashvars,
			base: baseSwfPath,
			renderer: ruffleRenderer,
			quality: ruffleQuality,
			bgcolor: "#050C1F"
		});

	</script>
	<script type="text/javascript">
		// a big shop opens dozens of art files at once, so they are fetched quietly once the game has started
		// the browser keeps them, and the shop then finds them cached. prefetch.json comes from tools/build_prefetch.py
		window.addEventListener("load", function () {
			var connection = navigator.connection || {};
			// a phone is already tight on memory, and the files only save a short wait in the shop
			if (connection.saveData || !window.fetch || phPlayer.isMobile()) return;

			setTimeout(function () {
				fetch("prefetch.json").then(function (res) { return res.json(); }).then(function (list) {
					var queue = (list.swf || []).slice();

					function next() {
						var url = queue.shift();
						if (!url) return;

						fetch(url, { priority: "low" })
							.then(function (res) { return res.arrayBuffer(); })
							.catch(function () {})
							.then(function () { setTimeout(next, 150); });
					}

					next();
					next();
				}).catch(function () {});
			}, 30000);
		});
	</script>
	<div id="footer">
	</div>
	</center>
</body>
</html>
