<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events Calendar</title>
  <meta name="description" content="What's happening in Pixie Hollow this month and next." />
  <link rel="icon" href="/wings.ico" type="image/x-icon" />
  <link rel="preload" href="/site/nav.xml" as="fetch" />
  <link rel="preload" href="/site/img/calendar/calendar-bg.png" as="image" />
  <link rel="stylesheet" href="/site/nav/nav.css?v=20260926n" />
  <link rel="stylesheet" href="/site/site.css?v=20261028a" />
  <link rel="stylesheet" href="/site/calendarPage.css?v=20260926a" />
</head>
<body class="calendarPage">
  <div class="siteWrap">
    <nav id="mainNav" aria-label="Main"></nav>
    <div class="memberBar" data-member-bar hidden></div>

    <main class="pageFrame calendarFrame">
      <div class="pageInner calendarFrameInner">
        <div class="frameLogo"></div>
        <p class="breadCrumbs"><a href="/">Pixie Hollow</a> &gt; <span>Calendar</span></p>
        <h1 class="pageTitle calPageTitle">Calendar</h1>

        <ul class="calKey" id="calKey"></ul>

        <div class="calHeadRow">
          <h2 class="calHeadMonth" id="calHeadMonth">Loading Calendar&hellip;</h2>
          <div class="calClockBox">
            <p>Today is <span id="calTodayDate"></span></p>
            <p>Pixie Standard Time <span id="calClockTime"></span></p>
          </div>
        </div>

        <div class="calComingUp" id="calComingUp"></div>

        <div class="calBoard">
          <div class="calGridWrap">
            <div class="calColTitles" id="calColTitles"></div>
            <div class="calDays" id="calDays"></div>
          </div>
          <div class="calSide" id="calSide">
            <h3 id="calSideHeading">&nbsp;</h3>
            <div class="calSideEvents" id="calSideEvents"></div>
          </div>
        </div>

        <div class="calPager">
          <button class="calPagerBtn calPagerPrev" id="calPrev" type="button"><span>Previous Month</span></button>
          <button class="calPagerBtn calPagerNext" id="calNext" type="button"><span>Next Month</span></button>
        </div>

        <p class="center"><a class="calMeetLink" href="/calendarmeetlist.html">Meet the Coaches</a></p>
        <p class="calDisclaimer">Dates and times are subject to change without notice.</p>

        <div class="calEventPopup" id="calEventPopup" role="dialog" aria-labelledby="calEventPopupTitle" hidden>
          <button class="calEventPopupClose" id="calEventPopupClose" type="button" aria-label="Close">&times;</button>
          <h4 class="calEventPopupTitle" id="calEventPopupTitle"></h4>
          <p class="calEventPopupWhen" id="calEventPopupWhen"></p>
          <p class="calEventPopupWhere" id="calEventPopupWhere"></p>
          <p class="calEventPopupLink" id="calEventPopupLink"><a id="calEventPopupLinkA" href="#">Read More</a></p>
        </div>
      </div>
    </main>
  </div>

  <script src="/site/site.js?v=20261028a"></script>
  <script src="/site/nav.js?v=20260926n"></script>
  <script src="/site/loginModal.js?v=20260926n"></script>
  <script src="/site/calendarPage.js?v=20260926a"></script>
</body>
</html>
