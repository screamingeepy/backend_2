<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secret Codes</title>
  <meta name="description" content="Enter a secret code to unlock a special gift for your fairies." />
  <link rel="icon" href="/wings.ico" type="image/x-icon" />
  <link rel="preload" href="/site/nav.xml" as="fetch" />
  <link rel="stylesheet" href="/site/nav/nav.css?v=20260926m" />
  <link rel="stylesheet" href="/site/site.css?v=20261028a" />
  <link rel="stylesheet" href="/site/account.css?v=20261028a" />
</head>
<body class="interiorPage">
  <div class="siteWrap">
    <nav id="mainNav" aria-label="Main"></nav>
    <div class="memberBar" data-member-bar hidden></div>

    <main class="pageFrame">
      <div class="pageInner">
        <div class="frameLogo"></div>
        <p class="breadCrumbs"><a href="/">Pixie Hollow</a> &gt; <a href="/secretcodes.html">Secret Codes</a> </p>
        <h1 class="pageTitle">Secret Codes</h1>

        <h2 class="pageHeading">Unlock a Special Gift</h2>
        <p class="pageLead">Enter a secret code to unlock a special gift for your fairies.</p>

        <div class="acctBoxes">
          <div class="acctBox" id="codeBox">
            <form class="acctForm" id="codeForm" novalidate>
              <div class="formRow">
                <label for="codeInput">Enter Your Code Here:</label>
                <input class="textInput" id="codeInput" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" />
              </div>
              <p class="center"><button class="btnGold" type="submit" id="codeButton">Submit</button></p>
              <p class="formMessage" id="codeMessage" role="alert"></p>
            </form>
            <p class="fieldTip" id="codeLogin" hidden>You need to be logged in to use a code. <a href="#" data-login>Log in here</a>.</p>
          </div>

          <div class="acctBox" id="giftBox" hidden>
            <h3>Thank You!</h3>
            <p id="giftText"></p>
            <p id="giftOwned"></p>
            <p class="center"><a class="btnGold" href="#" data-login><span>Play</span></a></p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/site/site.js?v=20261028a"></script>
  <script src="/site/nav.js?v=20260926m"></script>
  <script src="/site/loginModal.js?v=20260926m"></script>
  <script src="/site/secretCodes.js?v=20260928a"></script>
</body>
