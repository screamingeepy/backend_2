<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password</title>
  <meta name="description" content="Set a new password for your Pixie Hollow account." />
  <link rel="icon" href="/wings.ico" type="image/x-icon" />
  <link rel="preload" href="/site/nav.xml" as="fetch" />
  <link rel="stylesheet" href="/site/nav/nav.css?v=20260926m" />
  <link rel="stylesheet" href="/site/site.css?v=20261028a" />
</head>
<body class="interiorPage">
  <div class="siteWrap">
    <nav id="mainNav" aria-label="Main"></nav>
    <div class="memberBar" data-member-bar hidden></div>

    <main class="pageFrame">
      <div class="pageInner">
        <div class="frameLogo"></div>
        <h1 class="pageTitle">Set Your New Password</h1>

        <div class="acctBoxes">
          <div class="acctBox" id="resetBox" hidden>
            <p>Account: <strong id="username"></strong></p>

            <form id="resetForm" novalidate>
              <div class="formRow">
                <label for="password">New Password:</label>
                <div>
                  <input class="textInput" id="password" type="password" autocomplete="new-password" required />
                  <p class="fieldError" id="passwordError"></p>
                </div>
              </div>

              <div class="formRow">
                <label for="confirm">Confirm Password:</label>
                <div>
                  <input class="textInput" id="confirm" type="password" autocomplete="new-password" required />
                  <p class="fieldError" id="confirmError"></p>
                </div>
              </div>

              <p class="center"><button class="btnGold" type="submit">Set Password</button></p>
              <p class="formMessage" id="message" role="alert"></p>
            </form>
          </div>

          <div class="acctBox" id="errorBox" hidden>
            <p><strong>That link has expired or is invalid.</strong></p>
            <p>Reset links work for 30 minutes after they're sent. <a href="/forgot.html">Get a new one</a></p>
          </div>

          <div class="acctBox" id="successBox" hidden>
            <h2 class="quill">Password Updated!</h2>
            <p>You can now <a href="/">log in</a> with your new password.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/site/site.js?v=20261028a"></script>
  <script src="/site/nav.js?v=20260926m"></script>
  <script src="/site/loginModal.js?v=20260926m"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search)
    const token = urlParams.get('token')

    async function init() {
      if (!token) {
        document.getElementById('errorBox').hidden = false
        return
      }

      try {
        const res = await fetch(`/account/reset/${token}`)
        const body = await res.json()

        if (body.success) {
          document.getElementById('username').textContent = body.username
          document.getElementById('resetBox').hidden = false
        } else {
          document.getElementById('errorBox').hidden = false
        }
      } catch (err) {
        document.getElementById('errorBox').hidden = false
      }
    }

    const form = document.getElementById('resetForm')
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const message = document.getElementById('message')
      message.textContent = ''

      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm').value

      let ok = true
      if (password.length < 6) {
        document.getElementById('passwordError').textContent = 'Password must be at least 6 characters.'
        ok = false
      } else {
        document.getElementById('passwordError').textContent = ''
      }

      if (password !== confirm) {
        document.getElementById('confirmError').textContent = 'Passwords do not match.'
        ok = false
      } else {
        document.getElementById('confirmError').textContent = ''
      }

      if (!ok) return

      try {
        const res = await fetch(`/account/reset/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newPassword: password })
        })
        const body = await res.json()

        if (body.success) {
          document.getElementById('resetBox').hidden = true
          document.getElementById('successBox').hidden = false
        } else {
          message.textContent = body.error || 'Something went wrong.'
        }
      } catch (err) {
        message.textContent = 'Sorry, something went wrong. Please try again.'
      }
    })

    init()
  </script>
</body>
</html>
